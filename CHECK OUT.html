<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Checkout MiikoWorld</title>

  <link rel="stylesheet" href="StyleAlfia.css">

  <style>

    /* ================= QTY BUTTON ================= */

    .qty-box{
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .qty-btn{
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: #ff69b4;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .qty-btn:hover{
      background: #ff3f9d;
      transform: scale(1.1);
    }

    .qty-number{
      font-size: 18px;
      font-weight: bold;
      color: #444;
      min-width: 20px;
      text-align: center;
    }

  </style>

</head>

<body>

  <!-- ================= CHECKOUT PAGE ================= -->

  
  <div class="checkout-page">

    <!-- LEFT -->
    <div class="checkout-left">

      <h2>🛒 Checkout Pesanan</h2>

      <!-- ITEM 1 -->
      <div class="checkout-item">

        <img src="Buku miiko 1.jpg">

        <div class="checkout-info">

          <h4>Miiko Volume 1</h4>

          <!-- QTY -->
          <div class="qty-box">

            <button class="qty-btn"
            onclick="kurangQty('qty1','harga1',35000)">
              -
            </button>

            <span class="qty-number" id="qty1">1</span>

            <button class="qty-btn"
            onclick="tambahQty('qty1','harga1',35000)">
              +
            </button>

          </div>

          <span id="harga1">Rp 35.000</span>

        </div>

      </div>

      <!-- ITEM 2 -->
      <div class="checkout-item">

        <img src="Buku miiko 2.jpg">

        <div class="checkout-info">

          <h4>Miiko Volume 2</h4>

          <!-- QTY -->
          <div class="qty-box">

            <button class="qty-btn"
            onclick="kurangQty('qty2','harga2',35000)">
              -
            </button>

            <span class="qty-number" id="qty2">1</span>

            <button class="qty-btn"
            onclick="tambahQty('qty2','harga2',35000)">
              +
            </button>

          </div>

          <span id="harga2">Rp 35.000</span>

        </div>

      </div>

      <!-- ALAMAT -->
      <div class="alamat-box">

        <h3>📍 Alamat Pengiriman</h3>

        <textarea placeholder="Masukkan alamat lengkap..."></textarea>

      </div>

      <!-- METODE -->
      <div class="payment-box">

        <h3>💳 Metode Pembayaran</h3>

        <select>
          <option>BCA</option>
          <option>BNI</option>
          <option>MANDIRI</option>
          <option>DANA</option>
          <option>OVO</option>
        </select>

      </div>

    </div>

    <!-- RIGHT -->
    <div class="checkout-right">

      <h3>Ringkasan Belanja</h3>

      <div class="summary-item">
        <p>Total Item</p>
        <span id="totalItem">2</span>
      </div>

      <div class="summary-item">
        <p>Subtotal</p>
        <span id="subtotal">Rp 70.000</span>
      </div>

      <div class="summary-item">
        <p>Ongkir</p>
        <span>Rp 10.000</span>
      </div>

      <hr>

      <div class="summary-total">
        <h3>Total</h3>
        <h2 id="totalHarga">Rp 80.000</h2>
      </div>

      <button class="checkout-btn" onclick="checkoutNow()">
       Checkout Sekarang
      </button>

    </div>

  </div>

  <!-- ================= SCRIPT ================= -->

  <script>

    function tambahQty(qtyId, hargaId, hargaSatuan){

      let qtyElement = document.getElementById(qtyId);

      let qty = parseInt(qtyElement.innerText);

      qty++;

      qtyElement.innerText = qty;

      updateHarga(hargaId, qty, hargaSatuan);

      updateSummary();
    }

    function kurangQty(qtyId, hargaId, hargaSatuan){

      let qtyElement = document.getElementById(qtyId);

      let qty = parseInt(qtyElement.innerText);

      if(qty > 1){

        qty--;

        qtyElement.innerText = qty;

        updateHarga(hargaId, qty, hargaSatuan);

        updateSummary();
      }
    }

    function updateHarga(hargaId, qty, hargaSatuan){

      let totalHarga = qty * hargaSatuan;

      document.getElementById(hargaId).innerText =
      "Rp " + totalHarga.toLocaleString('id-ID');
    }

    function updateSummary(){

      let qty1 =
      parseInt(document.getElementById("qty1").innerText);

      let qty2 =
      parseInt(document.getElementById("qty2").innerText);

      let totalItem = qty1 + qty2;

      let subtotal =
      (qty1 * 35000) + (qty2 * 35000);

      let ongkir = 10000;

      let total = subtotal + ongkir;

      document.getElementById("totalItem").innerText =
      totalItem;

      document.getElementById("subtotal").innerText =
      "Rp " + subtotal.toLocaleString('id-ID');

      document.getElementById("totalHarga").innerText =
      "Rp " + total.toLocaleString('id-ID');

      
    }

  </script>

 <script>

function checkoutNow() {

  alert("🎉 Pesanan berhasil dibuat!\n\nTerima kasih sudah belanja di MiikoWorld 💖");

  localStorage.removeItem("cart");

  document.getElementById("statusPesanan").innerHTML =
    "🟡 Status Pesanan : Menunggu Pembayaran";

}

</script>

<div id="statusPesanan" class="status-pesanan">
  📦 Status Pesanan : Sedang menunggu pembayaran 
</div>


</body>
</html>
